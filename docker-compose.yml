services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astrodoncel}
      POSTGRES_USER: ${POSTGRES_USER:-astrodoncel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astrodoncel}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR_LOCAL: /data
      TASK_RESULT_DIR: /data/task_results
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ${ECALLISTO_HOST_DIR:-./data}:/archive/ecallistodata:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR_LOCAL: /data
      TASK_RESULT_DIR: /data/task_results
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ${ECALLISTO_HOST_DIR:-./data}:/archive/ecallistodata:ro
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
