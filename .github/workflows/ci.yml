name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: astrodoncel_test
          POSTGRES_USER: astrodoncel
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astrodoncel -d astrodoncel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: burst_source_test
          MARIADB_USER: studio_reader
          MARIADB_PASSWORD: test-source-password
          MARIADB_ROOT_PASSWORD: test-root-password
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://astrodoncel:test-password@127.0.0.1:5432/astrodoncel_test
      ASTRODONCEL_TEST_DATABASE_URL: postgresql+psycopg://astrodoncel:test-password@127.0.0.1:5432/astrodoncel_test
      ASTRODONCEL_TEST_MYSQL_URL: mysql+pymysql://studio_reader:test-source-password@127.0.0.1:3307/burst_source_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests migrations tools scripts/start_single_host.py
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: python -m pytest
      - run: pip-audit -r requirements-dev.txt
      - run: DATABASE_URL=sqlite:////tmp/astrodoncel-migration.db alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Audit frontend dependencies
        timeout-minutes: 5
        env:
          AUDIT_REPORT: ${{ runner.temp }}/npm-audit.json
        run: |
          # Fail on real advisories, but never on an unreachable advisory
          # endpoint: a red run here blocks the Railway deploy of the public
          # demo for a reason that has nothing to do with the commit.
          for attempt in 1 2 3; do
            status=0
            npm audit --audit-level=high --json --fetch-retries=0 --fetch-timeout=60000 > "$AUDIT_REPORT" || status=$?
            if node -e "const r=require(process.env.AUDIT_REPORT); if (!r.metadata) process.exit(1); console.log('advisories:', JSON.stringify(r.metadata.vulnerabilities));"; then
              exit $status
            fi
            echo "::warning::npm audit could not reach the advisory endpoint (attempt ${attempt}/3)."
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "::warning::Dependency audit skipped: the npm advisory endpoint stayed unreachable."

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete stack
        run: sh scripts/docker-up.sh
      - name: Verify proxy, API and migrations
        run: |
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/ready | grep '"database":"ok"'
          curl --fail --silent http://127.0.0.1:8080/openapi.json | grep '"title":"AstroDoncel Studio API"'
          docker compose ps --all migrate --format '{{.ExitCode}}' | grep '^0$'
      - name: Build and smoke the single-host image
        run: |
          docker build -t astrodoncel-single:ci .
          docker run -d --name astrodoncel-single-ci -p 8001:8000 \
            -e DATABASE_URL=sqlite:////data/astrodoncel.db \
            astrodoncel-single:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then docker logs astrodoncel-single-ci; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8001/ | grep '<div id="root"></div>'
          curl --fail --silent http://127.0.0.1:8001/openapi.json | grep '"title":"AstroDoncel Studio API"'
      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop smoke stack
        if: always()
        run: |
          docker rm -f astrodoncel-single-ci 2>/dev/null || true
          docker compose down -v --remove-orphans
