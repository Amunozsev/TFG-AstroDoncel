name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: astrodoncel_test
          POSTGRES_USER: astrodoncel
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astrodoncel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://astrodoncel:test-password@127.0.0.1:5432/astrodoncel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests migrations tools
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest
      - run: pip-audit -r requirements-dev.txt
      - run: DATABASE_URL=sqlite:////tmp/astrodoncel-migration.db alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete stack
        run: sh scripts/docker-up.sh
      - name: Verify proxy, API and migrations
        run: |
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/ready | grep '"database":"ok"'
          curl --fail --silent http://127.0.0.1:8080/openapi.json | grep '"title":"AstroDoncel API"'
          docker compose ps --all migrate --format '{{.ExitCode}}' | grep '^0$'
      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop smoke stack
        if: always()
        run: docker compose down -v --remove-orphans
